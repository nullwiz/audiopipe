[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiopipe"
version = "0.3.0"
description = "Local speaker diarization and transcription with NVIDIA Nemotron models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AudioPipe Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=5.20.0",
    "pydub>=0.25.1",
    "demucs>=4.0.0",
    "numpy>=1.22.0",
    "tqdm>=4.64.0",
    "soundfile>=0.12.1",
    "librosa>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-timeout>=2.1.0", "ruff>=0.1.0", "mypy>=1.0.0"]

[project.scripts]
audiopipe = "pipeline:cli"
audiopipe-serve = "server:cli"

[tool.setuptools]
py-modules = ["pipeline", "dem", "diarize", "server"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["separated", "output", "web"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
ignore = [
    "G004",   # Logging statement uses f-string
    "ISC001", # conflicts with formatter
    "COM812", # conflicts with formatter
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchaudio.*",
    "demucs.*",
    "pydub.*",
    "librosa.*",
    "transformers.*",
    "numpy.*",
    "soundfile.*",
    "tqdm.*",
]
ignore_missing_imports = true
