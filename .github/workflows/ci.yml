name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly integration run, Monday 06:00 UTC

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy pydub
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --config-file mypy.ini dem.py diarize.py pipeline.py

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pydub
      - run: pytest test/test_unit.py -q

  integration:
    name: Integration (models + ffmpeg)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_CPU: "1"
      AUDIOPIPE_TESTING: "1"
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: pytest test/test_integration.py -v --tb=short --integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-output
          path: output/
          retention-days: 7
